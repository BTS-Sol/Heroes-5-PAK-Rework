<script>
function formatMoney(value) {
  const formatted = value.toFixed(2) + " €";
  if (value > 0) return `<span class="profit">+${formatted}</span>`;
  if (value < 0) return `<span class="loss">${formatted}</span>`;
  return formatted;
}

function calc() {
  const qty = parseFloat(document.getElementById("qty").value) || 0;
  const entryCert = parseFloat(document.getElementById("entryCert").value) || 0;
  const currentCertPrice = parseFloat(document.getElementById("currentCertPrice").value) || 0;
  const priceUnderlying = parseFloat(document.getElementById("priceUnderlying").value) || 0;
  const ko = parseFloat(document.getElementById("ko").value) || 0;
  const ratio = parseFloat(document.getElementById("ratio").value) || 1;

  const buyPriceUnderlying = parseFloat(document.getElementById("buyPriceUnderlying").value) || 0;
  const buyQty = parseFloat(document.getElementById("buyQty").value) || 0;
  const targetUnderlying = parseFloat(document.getElementById("targetUnderlying").value) || 0;

  const out1 = document.getElementById("out1");
  const out2 = document.getElementById("out2");
  const out3 = document.getElementById("out3");

  // Sicherheitscheck KO aktuell
  if (priceUnderlying <= ko) {
    out1.innerHTML = `<div class="danger-box">⚠️ KO erreicht! Der Basiswert liegt auf/unter der Schwelle.</div>`;
    out2.innerHTML = "";
    out3.innerHTML = "";
    return;
  }

  // --- 1. Aktuelle Position & Aufgeld berechnen ---
  const innerValue = Math.max(0, (priceUnderlying - ko) * ratio);
  // Das Aufgeld ist die Differenz zwischen Brokerpreis und innerem Wert
  const premium = currentCertPrice - innerValue; 
  
  // Effektiver Hebel basierend auf deinem tatsächlichen Brokerpreis
  const effectiveLeverage = (priceUnderlying * ratio) / currentCertPrice;
  
  const entryCost = qty * entryCert;
  const currentValue = qty * currentCertPrice;
  const pnl = currentValue - entryCost;

  out1.innerHTML = `
    <div class="result">
      <strong>Marktwert Position:</strong> ${currentValue.toFixed(2)} €<br>
      <strong>Einsatz:</strong> ${entryCost.toFixed(2)} €<br>
      <strong>Unreal. PnL:</strong> ${formatMoney(pnl)}<br><br>
      <strong>Effektiver Hebel:</strong> ${effectiveLeverage.toFixed(2)}x<br>
      <strong>Abstand zum KO:</strong> ${(priceUnderlying - ko).toFixed(2)} € (${((priceUnderlying - ko) / priceUnderlying * 100).toFixed(2)}%)
      <div class="premium-info">
        <em>Info: Innerer Wert ist ${innerValue.toFixed(2)} €. Der Broker verlangt aktuell ein Aufgeld von ${premium.toFixed(2)} € pro Stück.</em>
      </div>
    </div>
  `;

  // --- 2. Nachkauf ---
  // Zukünftiger Zertifikatepreis = neuer innerer Wert + unser ermitteltes Aufgeld
  const buyInnerValue = Math.max(0, (buyPriceUnderlying - ko) * ratio);
  const estBuyCertPrice = Math.max(0, buyInnerValue + premium); 

  const newQty = qty + buyQty;
  let newEntryCost = entryCost;
  let avgEntryCert = entryCert;

  if (buyQty > 0 && buyPriceUnderlying > ko) {
    newEntryCost = entryCost + (buyQty * estBuyCertPrice);
    avgEntryCert = newEntryCost / newQty;
    
    // PnL beim Nachkaufkurs (nur interessant für die alte Position, da neue Position PnL=0 beim Kauf hat)
    const newPositionValueAtBuyTime = newQty * estBuyCertPrice;
    const pnlAtBuyTime = newPositionValueAtBuyTime - newEntryCost;

    out2.innerHTML = `
      <div class="result">
        <strong>Zertifikatpreis (Nachkauf):</strong> ${estBuyCertPrice.toFixed(2)} €<br>
        <strong>Gesamtanteile:</strong> ${newQty} Stück<br>
        <strong>Neuer Buy-In:</strong> ${avgEntryCert.toFixed(2)} €<br>
        <strong>Gesamtkapital:</strong> ${newEntryCost.toFixed(2)} €<br>
        <strong>Buchverlust (beim Nachkauf):</strong> ${formatMoney(pnlAtBuyTime)}
      </div>
    `;
  } else if (buyPriceUnderlying <= ko && buyQty > 0) {
     out2.innerHTML = `<div class="danger-box">⚠️ Beim Nachkaufkurs ist das KO-Level bereits erreicht.</div>`;
  } else {
    out2.innerHTML = `<div class="result">Kein Nachkauf eingegeben.</div>`;
  }

  // --- 3. Zielkurs ---
  if (targetUnderlying > ko) {
    const targetInnerValue = Math.max(0, (targetUnderlying - ko) * ratio);
    const estTargetCertPrice = Math.max(0, targetInnerValue + premium);
    
    // Ohne Nachkauf
    const targetValueBase = qty * estTargetCertPrice;
    const pnlBase = targetValueBase - entryCost;

    // Mit Nachkauf
    const targetValueNew = newQty * estTargetCertPrice;
    const pnlNew = targetValueNew - newEntryCost;

    out3.innerHTML = `
      <div class="result">
        <strong>Zertifikatpreis (Ziel):</strong> ${estTargetCertPrice.toFixed(2)} €<br><br>
        <strong>PnL ohne Nachkauf:</strong> ${formatMoney(pnlBase)} <em>(${targetValueBase.toFixed(2)} €)</em><br>
        <strong>PnL mit Nachkauf:</strong> ${formatMoney(pnlNew)} <em>(${targetValueNew.toFixed(2)} €)</em>
      </div>
    `;
  } else {
    out3.innerHTML = `<div class="danger-box">⚠️ Bei diesem Zielkurs ist das Zertifikat KO gegangen.</div>`;
  }
}

document.getElementById("calculator").addEventListener("input", calc);
calc();
</script>
