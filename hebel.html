<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Long Knockout Rechner</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
      background: #f6f7f9;
    }
    h1 { font-size: 22px; margin-bottom: 20px; }

    .card {
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    input {
      width: 100%;
      padding: 8px;
      margin: 6px 0 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      background: #1f6feb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .result {
      background: #eef6ff;
      padding: 10px;
      border-radius: 6px;
      margin-top: 10px;
      white-space: pre-line;
    }

    .danger {
      color: #b00020;
      font-weight: bold;
    }
  </style>
</head>
<body>

<h1>Long Knockout Positionsrechner</h1>

<div class="card">
  <h3>Position</h3>

  <div class="row">
    <div>
      <label>Anteile</label>
      <input id="qty" type="number" value="80">
    </div>
    <div>
      <label>Einstieg (€)</label>
      <input id="entry" type="number" value="4">
    </div>
  </div>

  <div class="row">
    <div>
      <label>Knockout-Level (€)</label>
      <input id="ko" type="number" value="2">
    </div>
    <div>
      <label>Aktueller Kurs (€)</label>
      <input id="price" type="number" value="4">
    </div>
  </div>

  <button onclick="calc()">Berechnen</button>

  <div id="out1" class="result"></div>
</div>

<div class="card">
  <h3>Nachkauf</h3>

  <div class="row">
    <div>
      <label>Kurs beim Nachkauf (€)</label>
      <input id="buyPrice" type="number" value="6">
    </div>
    <div>
      <label>Neue Anteile</label>
      <input id="buyQty" type="number" value="20">
    </div>
  </div>

  <button onclick="calc()">Nachkauf berechnen</button>

  <div id="out2" class="result"></div>
</div>

<div class="card">
  <h3>Zielkurs</h3>
  <input id="target" type="number" value="8">
  <button onclick="calc()">Ziel berechnen</button>
  <div id="out3" class="result"></div>
</div>

<script>
function leverage(price, ko) {
  if (price <= ko) return 0;
  return price / (price - ko);
}

function calc() {
  const qty = +document.getElementById("qty").value;
  const entry = +document.getElementById("entry").value;
  const ko = +document.getElementById("ko").value;
  const price = +document.getElementById("price").value;

  const buyPrice = +document.getElementById("buyPrice").value;
  const buyQty = +document.getElementById("buyQty").value;
  const target = +document.getElementById("target").value;

  // Sicherheitscheck KO
  if (price <= ko) {
    document.getElementById("out1").innerHTML =
      `<span class="danger">KO erreicht – Position wertlos</span>`;
    return;
  }

  const levNow = leverage(price, ko);
  const value = qty * price;
  const entryCost = qty * entry;

  document.getElementById("out1").innerText =
`Marktwert: ${value.toFixed(2)} €
Einsatz: ${entryCost.toFixed(2)} €
Unreal. PnL: ${(value - entryCost).toFixed(2)} €
Impliziter Hebel: ${levNow.toFixed(2)}x
KO-Abstand: ${(price - ko).toFixed(2)} €`;

  // Nachkauf
  const newQty = qty + buyQty;

  const avgEntry =
    (qty * entry + buyQty * buyPrice) / newQty;

  const newValue = newQty * price;

  document.getElementById("out2").innerText =
`Gesamtanteile: ${newQty}
Neuer Durchschnitts-Entry: ${avgEntry.toFixed(2)} €
Positionwert: ${newValue.toFixed(2)} €
Neuer PnL: ${(newValue - (qty*entry + buyQty*buyPrice)).toFixed(2)} €`;

  // Ziel
  const targetValue = newQty * target;

  document.getElementById("out3").innerText =
`Wert bei Zielkurs: ${targetValue.toFixed(2)} €
PnL ohne Nachkauf: ${(qty*(target-entry)).toFixed(2)} €
PnL mit Nachkauf: ${(targetValue - (qty*entry + buyQty*buyPrice)).toFixed(2)} €`;
}

calc();
</script>

</body>
</html>
